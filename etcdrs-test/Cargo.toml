[package]
name = "etcdrs-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration test infrastructure for etcdrs: spawn real etcd servers and clusters, with rstest fixtures"
documentation = "https://docs.rs/etcdrs-test"
readme = "README.md"
keywords = ["etcd", "testing", "rstest", "fixtures", "integration"]
categories = ["development-tools::testing", "database"]

[package.metadata.docs.rs]
features = ["rstest"]

[features]
rstest = ["dep:rstest"]

[dependencies]
etcdrs.workspace = true
etcd-bin-vendored.workspace = true
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
rstest = { workspace = true, optional = true, features = ["async-timeout", "crate-name"] }
socket2.workspace = true
tokio = { workspace = true, default-features = false, features = ["rt", "time"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
etcdrs-test = { path = ".", features = ["rstest"] }
futures = { workspace = true, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt", "time"] }
# Used by tests/retry.rs to assert a failure really was a pre-send connect failure rather than
# anything a server could have answered. Already in the tree via etcdrs.
tonic.workspace = true
