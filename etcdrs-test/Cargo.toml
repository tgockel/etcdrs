[package]
name = "etcdrs-test"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration test infrastructure for etcdrs: spawn real etcd servers and clusters, with rstest fixtures"
documentation = "https://docs.rs/etcdrs-test"
readme = "README.md"
keywords = ["etcd", "testing", "rstest", "fixtures", "integration"]
categories = ["development-tools::testing", "database"]

[package.metadata.docs.rs]
features = ["rstest"]

[features]
rstest = ["dep:rstest"]

[dependencies]
etcdrs.workspace = true
etcd-bin-vendored.workspace = true
futures = { workspace = true, default-features = true }
rand = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
rstest = { workspace = true, optional = true, features = ["async-timeout", "crate-name"] }
tokio = { workspace = true, default-features = false, features = ["rt", "time"] }

[dev-dependencies]
etcdrs-test = { path = ".", features = ["rstest"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt", "time"] }
