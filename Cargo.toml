[workspace]
members = [
    "etcdrs",
    "etcdrs-test",
    "etcdrs-util",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-stream        = { version = "^0.3.5",  default-features = false }
bytes               = { version = "^1.10",   default-features = false }
etcd-bin-vendored   = { version = "^3.6.7",  default-features = false }
futures-core        = { version = "^0.3.30", default-features = false }
futures             = { version = "^0.3.30", default-features = false }
prost               = { version = "^0.14.3", default-features = false }
prost-types         = { version = "^0.14.3", default-features = false }
protoc-bin-vendored = { version = "^3.2.0",  default-features = false }
rand                = { version = "^0.10.1", default-features = false }
rstest              = { version = "^0.26.0", default-features = false }
tokio               = { version = "^1.38.0", default-features = false }
tonic               = { version = "^0.14.3", default-features = false }
tonic-prost         = { version = "^0.14.3", default-features = false }
tonic-prost-build   = { version = "^0.14.3", default-features = false }
url                 = { version = "^2.5.2",  default-features = false }

# Local dependencies
etcdrs      = { path = "etcdrs" }
etcdrs-test = { path = "etcdrs-test" }
etcdrs-util = { path = "etcdrs-util" }
