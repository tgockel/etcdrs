[workspace]
members = [
    "etcdrs",
    "etcdrs-test",
    "etcdrs-util",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-stream = "^0.3.5"
bytes = "^1.10"
etcd-bin-vendored = "^3.6.7"
futures-core = "^0.3.30"
futures = { version = "^0.3.30", default-features = false }
prost = "^0.14.3"
prost-types = "^0.14.3"
protoc-bin-vendored = "^3.2.0"
rand = "^0.8.5"
rstest = "^0.21.0"
tokio = { version = "^1.38.0", default-features = false }
tonic = "^0.14.3"
tonic-prost = "^0.14.3"
tonic-prost-build = "^0.14.3"
url = "^2.5.2"

# Local dependencies
etcdrs      = { path = "etcdrs" }
etcdrs-test = { path = "etcdrs-test" }
etcdrs-util = { path = "etcdrs-util" }
