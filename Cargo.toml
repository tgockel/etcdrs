[workspace]
members = [
    "etcdrs",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
prost = "^0.13.1"
prost-types = "^0.13.1"
rstest = "^0.21.0"
tokio = { version = "^1.38.0", default-features = false }
tonic = "^0.12.0"
tonic-build = "^0.12.0"
url = "^2.5.2"

etcdrs = { path = "etcdrs" }
