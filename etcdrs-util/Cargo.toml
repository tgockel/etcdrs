[package]
name = "etcdrs-util"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Higher-level utilities for etcdrs: a watch-coherent read cache and an automatic lease pool"
documentation = "https://docs.rs/etcdrs-util"
readme = "README.md"
keywords = ["etcd", "cache", "lease", "async", "client"]
categories = ["database", "asynchronous", "caching"]

[dependencies]
async-stream.workspace = true
bytes = { workspace = true, features = ["std"] }
etcdrs.workspace = true
futures = { workspace = true, default-features = false, features = ["std"] }
futures-core = { workspace = true, features = ["std"] }
rand = { workspace = true, features = ["std", "std_rng"] }
tokio = { workspace = true, default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
etcdrs-test = { workspace = true, features = ["rstest"] }
rstest = { workspace = true, features = ["async-timeout", "crate-name"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt", "time"] }

[features]
default = [
    "cache",
    "lease-pool",
]
cache = ["tokio/time"]
lease-pool = ["tokio/time"]
