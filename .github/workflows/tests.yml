name: unit-test

on:
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Test/Debug
      run: cargo test --verbose
    - name: Test/Release
      run: cargo test --release --verbose
    - name: Docs
      run: cargo doc --verbose
    - name: Format Check
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy

  # Name the feature rather than using --all-features, which would pull in `generate` and rebuild
  # the checked-in protobuf bindings. That is a deliberate manual step, not something CI should do.
  nightly-features:
    name: nightly-async-iterator
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install nightly
      run: rustup toolchain install nightly --profile minimal
    - name: Check
      run: cargo +nightly check --workspace --all-targets --features etcdrs/nightly-async-iterator --verbose
    - name: Test
      run: cargo +nightly test -p etcdrs --features nightly-async-iterator --verbose
