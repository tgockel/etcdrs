[package]
name = "etcdrs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "An async etcd v3 client built on tonic and tokio, with composable operation builders and type-safe responses"
documentation = "https://docs.rs/etcdrs"
readme = "README.md"
keywords = ["etcd", "client", "grpc", "async", "tonic"]
categories = ["database", "asynchronous", "api-bindings"]

[dependencies]
async-stream.workspace = true
bytes = { workspace = true, features = ["std"] }
futures-core = { workspace = true, features = ["std"] }
prost = { workspace = true, features = ["derive", "std"] }
prost-types = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
tonic = { workspace = true, features = ["codegen", "transport"] }
tonic-prost.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["std"] }
tokio = { workspace = true, default-features = false, features = ["macros", "rt"] }

[build-dependencies]
protoc-bin-vendored = { workspace = true, optional = true }
tonic-prost-build = { workspace = true, optional = true, features = ["transport", "cleanup-markdown"] }

[features]
default = []
generate = ["dep:protoc-bin-vendored", "dep:tonic-prost-build"]
nightly-async-iterator = []  # enable `std::async_iter` features
